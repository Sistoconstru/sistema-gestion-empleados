<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cartel: {{ encuesta.nombre }}</title>
    <style>
        @page { size: letter portrait; margin: 1.5cm; }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #1f2937; background: #fff; margin: 0; text-align: center;
        }
        .cartel { max-width: 18cm; margin: 0 auto; padding: 1.5cm 1cm; }
        .etiqueta {
            display: inline-block; background: #667eea; color: #fff;
            padding: .35rem 1rem; border-radius: 999px; font-weight: 600; letter-spacing: .05em;
        }
        h1 { font-size: 2.4rem; margin: 1rem 0 .5rem; line-height: 1.15; }
        .cierre { font-size: 1.3rem; color: #4b5563; margin-bottom: 1.5rem; }
        .qr svg { width: 11cm; height: 11cm; }
        .pasos { font-size: 1.2rem; margin: 1.2rem auto 0; max-width: 14cm; text-align: left; }
        .pasos li { margin-bottom: .4rem; }
        .enlace { margin-top: 1rem; font-size: .85rem; color: #6b7280; word-break: break-all; }
        .barra { margin: 1rem; }
        @media print { .barra { display: none; } }
    </style>
</head>
<body>
    <div class="barra">
        <button onclick="window.print()">Imprimir</button>
    </div>
    <div class="cartel">
        <span class="etiqueta">ENCUESTA</span>
        <h1>{{ encuesta.nombre }}</h1>
        <div class="cierre">Responde antes del {{ encuesta.fecha_fin|date:"d/m/Y" }}</div>
        <div class="qr">{{ qr_svg }}</div>
        <ol class="pasos">
            <li>Abre la cámara del celular y apunta al código.</li>
            <li>Toca el enlace que aparece.</li>
            <li>Entra con tu usuario de SIGHU y responde.</li>
        </ol>
        <div class="enlace">{{ enlace }}</div>
    </div>
</body>
</html>
