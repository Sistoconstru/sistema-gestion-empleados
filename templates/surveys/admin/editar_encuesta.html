{% extends "base.html" %}
{% block title %}Editar encuesta: {{ encuesta.nombre }} | SIGHU{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm border-corporativo">
    <div class="card-header bg-corporativo text-white d-flex justify-content-between align-items-center">
      <h4 class="mb-0"><i class="fas fa-cog me-2"></i>Editar encuesta</h4>
      <a href="{% url 'surveys:encuesta_admin_list' %}" class="btn btn-light btn-sm">
        <i class="fas fa-arrow-left me-1"></i>Volver
      </a>
    </div>
    <div class="card-body">
      <div class="alert alert-info">
        <strong>Código:</strong> {{ encuesta.codigo }} · No editable.
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">Nombre *</label>
            <input type="text" name="nombre" class="form-control" value="{{ encuesta.nombre }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Tipo de Encuesta *</label>
            <select name="tipo_encuesta" class="form-select" required>
              {% for t in tipos_encuesta %}
              <option value="{{ t.id }}" {% if t.id == encuesta.tipo_encuesta_id %}selected{% endif %}>{{ t.nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha inicio *</label>
            <input type="date" name="fecha_inicio" class="form-control" value="{{ encuesta.fecha_inicio|date:'Y-m-d' }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha fin *</label>
            <input type="date" name="fecha_fin" class="form-control" value="{{ encuesta.fecha_fin|date:'Y-m-d' }}" required>
          </div>
          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea name="descripcion" class="form-control" rows="3">{{ encuesta.descripcion }}</textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Instrucciones (opcional)</label>
            <textarea name="instrucciones" class="form-control" rows="3">{{ encuesta.instrucciones }}</textarea>
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-corporativo"><i class="fas fa-save me-1"></i>Guardar cambios</button>
          <a href="{% url 'surveys:encuesta_admin_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
