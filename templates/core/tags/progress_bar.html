<div class="progress">
    <div class="progress-bar bg-{{ color }}" 
         role="progressbar" 
         style="width: {{ percentage }}%" 
         aria-valuenow="{{ current }}" 
         aria-valuemin="0" 
         aria-valuemax="{{ total }}">
        {% if show_percentage %}
            {{ percentage }}%
        {% endif %}
    </div>
</div>

{% if show_percentage %}
<div class="d-flex justify-content-between small text-muted mt-1">
    <span>{{ current }} de {{ total }}</span>
    <span>{{ percentage }}%</span>
</div>
{% endif %}
