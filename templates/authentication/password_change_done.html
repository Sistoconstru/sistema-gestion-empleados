{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contraseña actualizada</title>
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-container {
            background: rgba(255,255,255,0.95);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            border-radius: 1.2rem;
            padding: 2.5rem;
            max-width: 380px;
            width: 100%;
            text-align: center;
            margin: 1rem;
        }
        .login-avatar {
            font-size: 4.5rem;
            color: #2e7d32;
            margin-bottom: 1rem;
        }
        .login-container h2 {
            font-weight: 700;
            margin-bottom: 1rem;
            color: #2193b0;
        }
        .login-btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem;
            background: #ff9800;
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            transition: background 0.2s;
            text-decoration: none;
            box-sizing: border-box;
        }
        .login-btn:hover { background: #fb8c00; text-decoration: none; color: #fff; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-avatar">
            <i class="fa fa-circle-check"></i>
        </div>
        <h2>Contraseña actualizada</h2>
        <p style="color:#555; margin-bottom:1.8rem;">
            Tu nueva contraseña quedó guardada. Ya puedes seguir usando el sistema.
        </p>
        <a href="{% url 'employees:feed_list' %}" class="login-btn">Ir al inicio</a>
    </div>
</body>
</html>
